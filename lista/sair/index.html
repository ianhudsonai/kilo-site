<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<script>
// The leave code comes after # (#t=<code>), which browsers never send to the web host. It is read once and taken out of
// the address before anything else loads. A code in ?t= is refused (it has already reached the host) and taken out too.
(function () {
  var query = new URLSearchParams(location.search);
  var hash = new URLSearchParams(location.hash.slice(1));
  var lang = (hash.get('lang') || query.get('lang')) === 'en' ? 'en' : 'pt';
  window.KILO_LEAVE = { token: hash.get('t') || '', lang: lang };
  if (query.has('t') || location.hash) {
    try { history.replaceState(null, '', location.pathname + (lang === 'en' ? '?lang=en' : '')); } catch (e) {}
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Kilo · Sair da lista de espera</title>
<style>
  :root { --bg: #F5F4EE; --card: #FFFFFF; --text: #20231F; --muted: #555C55; --line: #D8D9CE; --accent: #F3D438; --on-accent: #20231F; --link: #7D6400; --error: #A12B1F; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171A19; --card: #232725; --text: #F5F4E9; --muted: #BEC2B7; --line: #43483F; --link: #F3D438; --error: #FF9B8C; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 480px; padding: 32px 16px; }
  .mark { display: inline-flex; width: 56px; height: 56px; border-radius: 14px; background: var(--accent) url(/assets/img/icone.webp) center / cover; color: transparent; font-size: 0; text-decoration: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-top: 22px; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  a { color: var(--link); font-weight: 600; }
  button { width: 100%; margin-top: 12px; font: inherit; font-weight: 700; padding: 14px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
  button:disabled { opacity: 0.6; }
  .error { color: var(--error); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <a href="/" class="mark" aria-label="Kilo">K</a>
  <section>
    <div id="ask">
      <h1 data-pt="Sair da lista de espera" data-en="Leave the waitlist">Sair da lista de espera</h1>
      <p data-pt="Seu e-mail vai ser apagado da lista e não vamos mais escrever para você." data-en="Your email will be deleted from the list and we will not write to you again.">Seu e-mail vai ser apagado da lista e não vamos mais escrever para você.</p>
      <button type="button" id="leave" data-pt="Sair da lista" data-en="Leave the list">Sair da lista</button>
      <p id="error" class="error" role="status" aria-live="polite"></p>
    </div>
    <div id="done" hidden>
      <h1 data-pt="Pronto, você saiu da lista." data-en="Done, you are off the list.">Pronto, você saiu da lista.</h1>
      <p class="muted" data-pt="Seu e-mail foi apagado." data-en="Your email has been deleted.">Seu e-mail foi apagado.</p>
    </div>
    <div id="nolink" hidden>
      <h1 data-pt="Link incompleto" data-en="Incomplete link">Link incompleto</h1>
      <p data-pt="Abra o link direto do nosso e-mail, ou escreva para contato@kiloapp.com.br e tiramos você da lista." data-en="Open the link straight from our email, or write to contato@kiloapp.com.br and we will take you off the list.">Abra o link direto do nosso e-mail, ou escreva para contato@kiloapp.com.br e tiramos você da lista.</p>
    </div>
  </section>
  <p class="muted"><a href="mailto:contato@kiloapp.com.br">contato@kiloapp.com.br</a></p>
</main>
<script src="/lista/config.js"></script>
<script>
(function () {
  var lang = window.KILO_LEAVE.lang;
  var token = window.KILO_LEAVE.token;
  if (lang === 'en') {
    document.documentElement.lang = 'en';
    document.title = 'Kilo · Leave the waitlist';
    document.querySelectorAll('[data-en]').forEach(function (el) { el.textContent = el.getAttribute('data-en'); });
  }
  var failed = lang === 'en' ? 'Could not do it. Check your connection and try again.' : 'Não deu certo. Confira sua internet e tente de novo.';
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token)) {
    document.getElementById('ask').hidden = true;
    document.getElementById('nolink').hidden = false;
    return;
  }
  // Leaving takes a tap, so a mail scanner that opens the link on its own does not take anyone off the list.
  var button = document.getElementById('leave');
  button.addEventListener('click', function () {
    var config = window.KILO_WAITLIST || {};
    var error = document.getElementById('error');
    error.textContent = '';
    if (!config.url || !config.key) { error.textContent = failed; return; }
    button.disabled = true;
    fetch(config.url + '/rest/v1/rpc/leave_waitlist', {
      method: 'POST',
      headers: { 'content-type': 'application/json', apikey: config.key },
      body: JSON.stringify({ p_token: token })
    }).then(function (response) {
      if (!response.ok) throw new Error('status ' + response.status);
      token = window.KILO_LEAVE.token = '';
      document.getElementById('ask').hidden = true;
      document.getElementById('done').hidden = false;
    }).catch(function () {
      error.textContent = failed;
      button.disabled = false;
    });
  });
})();
</script>
</body>
</html>
